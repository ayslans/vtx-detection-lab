name: CI — Detection-as-Code & AppSec Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detection-gate:
    name: Tests & Replay (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit and E2E tests (pytest)
        run: pytest -v --cov=vtx_detection_lab --cov-report=term-missing

      - name: Validate YAML catalog & Wazuh XML MITRE parity
        run: python -m vtx_detection_lab.main validate

      - name: Run telemetry replay strict gate (0 FP / 0 FN)
        run: |
          python -m vtx_detection_lab.main replay \
            --telemetry telemetry/fixtures/atomic_replay_events.json \
            --output artifacts/atomic_replay_report.md \
            --strict

      - name: Upload replay report artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: atomic-replay-report
          path: artifacts/atomic_replay_report.md
          retention-days: 14

  appsec-scan:
    name: AppSec — Bandit SAST & pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install runtime dependencies and AppSec scanners
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e . bandit pip-audit

      - name: Run Bandit SAST (Medium+ severity & confidence)
        run: |
          mkdir -p artifacts
          bandit -r src -ll -ii -f json -o artifacts/bandit-report.json || true
          bandit -r src -ll -ii

      - name: Run pip-audit (dependency CVE check)
        run: |
          mkdir -p artifacts
          pip-audit --skip-editable --desc on --format json --output artifacts/pip-audit-report.json || true
          pip-audit --skip-editable --desc on

      - name: Upload AppSec scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appsec-reports-vtx-detection-lab
          path: artifacts/
          retention-days: 14
