name: CI — Detection-as-Code & AppSec Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detection-gate:
    name: Tests & Replay (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit and E2E tests (pytest)
        run: pytest -v --cov=vtx_detection_lab --cov-report=term-missing

      - name: Validate YAML catalog & Wazuh XML MITRE parity
        run: python -m vtx_detection_lab.main validate

      - name: Validate enrich_alerts.sh syntax
        run: bash -n scripts/enrich_alerts.sh

      - name: Normalize Nginx and FastAPI logs and validate strict replay
        run: |
          mkdir -p artifacts/normalized
          python -m vtx_detection_lab.main normalize \
            --input telemetry/fixtures/sample_nginx.log \
            --source nginx \
            --host PAY-LNX-GW-01 \
            --assets examples/assets.yaml \
            --output artifacts/normalized/nginx.jsonl \
            --strict

          python -m vtx_detection_lab.main normalize \
            --input telemetry/fixtures/sample_fastapi.log \
            --source fastapi \
            --host PAY-LNX-GW-01 \
            --assets examples/assets.yaml \
            --output artifacts/normalized/fastapi.jsonl \
            --strict

          cat artifacts/normalized/nginx.jsonl artifacts/normalized/fastapi.jsonl > artifacts/normalized/http_combined.jsonl

          python -m vtx_detection_lab.main replay \
            --telemetry artifacts/normalized/http_combined.jsonl \
            --assets examples/assets.yaml \
            --output artifacts/normalized/http_replay_report.md \
            --strict

      - name: Run telemetry replay strict gate (0 FP / 0 FN) with asset inventory
        run: |
          python -m vtx_detection_lab.main replay \
            --telemetry telemetry/fixtures/atomic_replay_events.json \
            --assets examples/assets.yaml \
            --output artifacts/atomic_replay_report.md \
            --alerts-jsonl artifacts/alerts.jsonl \
            --strict

      - name: Correlate TI enrichment and vulnerability triage by asset_id
        env:
          MATRIX_PY_VER: ${{ matrix.python-version }}
        run: |
          mkdir -p artifacts/correlation
          python -m vtx_detection_lab.main correlate \
            --ti-input telemetry/fixtures/sample_ti_enrichment.json \
            --triage-input telemetry/fixtures/sample_triage_report.json \
            --assets examples/assets.yaml \
            --output artifacts/correlation/correlated_assets.json \
            --md-output artifacts/correlation/correlated_soc_summary.md
          test -s artifacts/correlation/correlated_assets.json
          test -s artifacts/correlation/correlated_soc_summary.md
          if [ "${MATRIX_PY_VER}" = "3.12" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat artifacts/correlation/correlated_soc_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SOC correlation artifacts (JSON + Markdown)
        uses: actions/upload-artifact@v7
        with:
          name: soc-correlation-report-py${{ matrix.python-version }}
          path: |
            artifacts/correlation/correlated_assets.json
            artifacts/correlation/correlated_soc_summary.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload replay report and alerts JSONL artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: atomic-replay-report
          path: |
            artifacts/atomic_replay_report.md
            artifacts/alerts.jsonl
          retention-days: 14

  ti-enrichment-bridge:
    name: TI Bridge — Docker (v0.2.0) + SHA-256 Ledger + Correlate
    runs-on: ubuntu-latest
    needs: detection-gate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout vtx-vuln-triage-ai for offline vulnerability triage
        uses: actions/checkout@v7
        with:
          repository: ayslans/vtx-vuln-triage-ai
          path: vendor/vtx-vuln-triage-ai

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install vtx-detection-lab
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m pip install "pydantic>=2.7.0" "pydantic-settings>=2.2.0" "pyyaml>=6.0.1" "httpx>=0.27.0" "typer>=0.12.0" "rich>=13.7.0"

      - name: Download replay alerts JSONL artifact
        uses: actions/download-artifact@v7
        with:
          name: atomic-replay-report
          path: artifacts

      - name: Run enrich_alerts.sh dry-run, verify SHA-256 ledger and correlate
        run: |
          chmod +x scripts/enrich_alerts.sh
          ./scripts/enrich_alerts.sh \
            --input artifacts/alerts.jsonl \
            --output out/enriched/parse-report.json \
            --evidence-log out/enriched/evidence_ledger.jsonl \
            --asset-id pay-lnx-gw-01 \
            --verify-evidence \
            --docker \
            --dry-run

          mkdir -p out/triage
          TRIAGE_REPO="vendor/vtx-vuln-triage-ai"
          TRIAGE_PY="${TRIAGE_REPO}/.venv/bin/python"
          if [ ! -x "${TRIAGE_PY}" ]; then
            TRIAGE_PY="python3"
          fi
          TRIVY_INPUT="${TRIAGE_REPO}/data/raw/trivy_scan.json"
          if [ ! -s "${TRIVY_INPUT}" ]; then
            TRIVY_INPUT="/tmp/ci_trivy_scan.json"
            cat > "${TRIVY_INPUT}" << 'TRIVY_EOF'
          {
            "SchemaVersion": 2,
            "ArtifactName": "api-pagamentos-prod",
            "Results": [
              {
                "Target": "ghcr.io/ayslans/api-pagamentos:latest",
                "Class": "os-pkgs",
                "Type": "alpine",
                "Vulnerabilities": [
                  {
                    "VulnerabilityID": "CVE-2024-3094",
                    "PkgName": "xz-utils",
                    "InstalledVersion": "5.6.0-r0",
                    "FixedVersion": "5.6.1-r0",
                    "Severity": "CRITICAL",
                    "Title": "Malicious upstream compromise in xz-utils",
                    "CVSS": {"nvd": {"V3Score": 10.0}}
                  }
                ]
              }
            ]
          }
          TRIVY_EOF
          fi
          VIRTUAL_ENV="$(cd "${TRIAGE_REPO}" && pwd)/.venv" \
          PYTHONPATH="${TRIAGE_REPO}/src" \
          "${TRIAGE_PY}" -m vtx_vuln_triage.main \
            --input "${TRIVY_INPUT}" \
            --policy "${TRIAGE_REPO}/config/pci_policy.yaml" \
            --assets "${TRIAGE_REPO}/examples/assets.yaml" \
            --asset-id api-pagamentos-prod \
            --criticality CDE \
            --offline \
            --output out/triage/real_triage_report.md \
            --json-output out/triage/real_triage_report.json
          test -s out/triage/real_triage_report.json

          CORRELATE_ARGS=(
            --ti-input telemetry/fixtures/sample_ti_enrichment.json
            --triage-input out/triage/real_triage_report.json
            --assets "${TRIAGE_REPO}/examples/assets.yaml"
            --output out/enriched/bridge_correlated_assets.json
            --md-output out/enriched/bridge_soc_summary.md
          )
          if [ -s out/enriched/evidence_ledger.jsonl ]; then
            CORRELATE_ARGS+=(--evidence-log out/enriched/evidence_ledger.jsonl --verify-evidence-chain)
          fi

          python -m vtx_detection_lab.main correlate "${CORRELATE_ARGS[@]}"

          if [ -s out/enriched/evidence_ledger.jsonl ]; then
            python -m pip install -q cryptography
            chmod +x scripts/sign_ledger_head.sh scripts/verify_ledger_head.sh
            TMP_KEY="/tmp/vtx_ledger_signing_key.pem"
            TMP_PUB="/tmp/vtx_ledger_signing_pub.pem"
            trap 'rm -f "/tmp/vtx_ledger_signing_key.pem" "/tmp/vtx_ledger_signing_pub.pem"' EXIT
            if [ -n "${VTX_LEDGER_SIGNING_KEY_PEM:-}" ]; then
              printf '%s\n' "${VTX_LEDGER_SIGNING_KEY_PEM}" > "${TMP_KEY}"
              chmod 600 "${TMP_KEY}"
              ./scripts/sign_ledger_head.sh \
                out/enriched/evidence_ledger.jsonl \
                out/enriched/evidence_ledger.head.sig.json \
                "${TMP_KEY}" \
                "github-actions-ti-bridge"
              if [ -s config/ledger_signing_pub.pem ]; then
                ./scripts/verify_ledger_head.sh \
                  out/enriched/evidence_ledger.jsonl \
                  out/enriched/evidence_ledger.head.sig.json \
                  config/ledger_signing_pub.pem
              else
                ./scripts/verify_ledger_head.sh \
                  out/enriched/evidence_ledger.jsonl \
                  out/enriched/evidence_ledger.head.sig.json
              fi
            else
              openssl genpkey -algorithm Ed25519 -out "${TMP_KEY}" >/dev/null 2>&1
              chmod 600 "${TMP_KEY}"
              openssl pkey -in "${TMP_KEY}" -pubout -out "${TMP_PUB}" >/dev/null 2>&1
              ./scripts/sign_ledger_head.sh \
                out/enriched/evidence_ledger.jsonl \
                out/enriched/evidence_ledger.head.sig.json \
                "${TMP_KEY}" \
                "ephemeral-ci-signer"
              ./scripts/verify_ledger_head.sh \
                out/enriched/evidence_ledger.jsonl \
                out/enriched/evidence_ledger.head.sig.json \
                "${TMP_PUB}"
            fi
          fi
          test -s out/enriched/bridge_correlated_assets.json
          test -s out/enriched/bridge_soc_summary.md

          python3 - << 'CI_PY'
          import json
          from pathlib import Path

          parse_rep = json.loads(Path("out/enriched/parse-report.json").read_text(encoding="utf-8"))
          summary = parse_rep.get("summary", {})
          print(
              f"TI Bridge OK: candidates={summary.get('total_candidates')} | "
              f"enrichable={summary.get('unique_valid')} | "
              f"filtered_internal={summary.get('skipped_internal')}"
          )

          ledger_path = Path("out/enriched/evidence_ledger.jsonl")
          corr = json.loads(Path("out/enriched/bridge_correlated_assets.json").read_text(encoding="utf-8"))
          if ledger_path.exists() and ledger_path.stat().st_size > 0:
              ledger_hashes = {
                  json.loads(ln)["entry_hash"]
                  for ln in ledger_path.read_text(encoding="utf-8").splitlines()
                  if ln.strip()
              }
              corr_hashes = {
                  h
                  for asset in corr.get("assets", [])
                  for h in asset.get("threat_intel", {}).get("evidence_entry_hashes", [])
              }
              missing = ledger_hashes - corr_hashes
              assert not missing, f"entry_hash ausente na correlação: {missing}"
              print(f"SHA-256 ledger propagado com sucesso: {len(ledger_hashes)} entry_hash(es) verificados.")
          CI_PY

      - name: Upload TI Bridge artifacts (parse + SHA-256 ledger + correlation)
        if: always() && hashFiles('out/enriched/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ti-enrichment-dry-run
          path: out/enriched/
          retention-days: 14

  appsec-scan:
    name: AppSec — Bandit SAST & pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install runtime dependencies and AppSec scanners
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e . bandit pip-audit

      - name: Run Bandit SAST (Medium+ severity & confidence)
        run: |
          mkdir -p artifacts
          bandit -r src -ll -ii -f json -o artifacts/bandit-report.json || true
          bandit -r src -ll -ii

      - name: Run pip-audit (dependency CVE check)
        run: |
          mkdir -p artifacts
          pip-audit --skip-editable --desc on --format json --output artifacts/pip-audit-report.json || true
          pip-audit --skip-editable --desc on

      - name: Upload AppSec scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appsec-reports-vtx-detection-lab
          path: artifacts/
          retention-days: 14

  trivy-scan:
    name: Trivy — Filesystem, IaC & Container SARIF
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare artifacts directory
        run: mkdir -p artifacts

      - name: Trivy Filesystem & IaC scan (vuln, secret, misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret,misconfig"
          format: "sarif"
          output: "artifacts/trivy-fs.sarif"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy FS SARIF to GitHub Security
        if: always() && hashFiles('artifacts/trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "artifacts/trivy-fs.sarif"
          category: "trivy-fs-vtx-detection-lab"

      - name: Build and smoke-test hardened container image
        if: ${{ !cancelled() }}
        run: |
          docker build -t vtx-detection-lab:ci .
          docker run --rm vtx-detection-lab:ci validate

      - name: Trivy Container Image scan
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: "image"
          image-ref: "vtx-detection-lab:ci"
          vuln-type: "os,library"
          format: "sarif"
          output: "artifacts/trivy-container.sarif"
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy Container SARIF to GitHub Security
        if: always() && hashFiles('artifacts/trivy-container.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "artifacts/trivy-container.sarif"
          category: "trivy-container-vtx-detection-lab"

      - name: Print Trivy SARIF findings on failure
        if: failure()
        run: |
          python3 - << 'TRIVY_PY'
          import json
          from pathlib import Path
          for sarif in sorted(Path("artifacts").glob("*.sarif")):
              data = json.loads(sarif.read_text(encoding="utf-8"))
              results = [r for run in data.get("runs", []) for r in run.get("results", [])]
              if results:
                  print(f"::group::{sarif.name} ({len(results)} findings)")
                  for r in results:
                      lines = [ln.strip() for ln in r.get("message", {}).get("text", "").splitlines() if ln.strip()]
                      print(f"- [{r.get('level')}] {r.get('ruleId')}: {' | '.join(lines[:5])}")
                  print("::endgroup::")
          TRIVY_PY

      - name: Upload Trivy SARIF artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sarif-vtx-detection-lab
          path: artifacts/*.sarif
          if-no-files-found: ignore
          retention-days: 14
